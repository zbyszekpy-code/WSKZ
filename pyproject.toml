[project]
name = "ai-router-poc"
version = "0.1.0"
description = "PoC AI microservice that routes user messages to the right department via email."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "ai-router-poc" }]
dependencies = [
  "email-validator",
  "fastapi",
  "uvicorn",
  "pydantic-ai",
  "pydantic-settings",
  "aiosmtplib>=5.1,<6",
  "tenacity>=9.1,<10",
]

[dependency-groups]
dev = [
  "detect-secrets",
  "httpx",
  "mypy",
  "pip-audit",
  "pre-commit",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
  "uv",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "TID", "RUF", "S"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config -m 'not integration' --cov=app --cov-report=term-missing"
xfail_strict = true
filterwarnings = ["error"]
asyncio_mode = "auto"
markers = ["integration: requires docker compose services"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
